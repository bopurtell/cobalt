name: Cobalt native CI

on:
  pull_request:
  push:
    branches:
      - oxcaml
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      cold:
        description: Benchmark cold provisioning (skip cache restore and save)
        type: boolean
        default: false
      release_tag:
        description: Existing release tag to build and attach to its draft (optional)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('cobalt-native-pr-{0}', github.event.pull_request.number) || format('cobalt-native-run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      OPAMROOT: /home/runner/.cobalt-ci-opam
      OPAMSWITCH: 5.2.0+ox
      OPAMJOBS: 2
      COBALT_BUILD_JOBS: 2
      DUNE_CACHE: disabled
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      - name: Prepare the Linux build host
        run: |
          # Reclaim space on the disposable hosted runner for OxCaml and its archive.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          time bash scripts/ci/toolchain.sh host
          df -h .

      - name: Check cache policy and workflow triggers
        run: python3 -B scripts/ci/test_cache.py

      - name: Calculate the toolchain key
        id: setup
        run: |
          key=$(bash scripts/ci/toolchain.sh key)
          echo "key=$key" | tee -a "$GITHUB_OUTPUT"

      - name: Restore exact toolchain
        id: restore
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.cold) }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.OPAMROOT }}
          key: ${{ steps.setup.outputs.key }}

      - name: Provision compiler and third-party dependencies
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        run: time bash scripts/ci/toolchain.sh provision

      - name: Verify restored toolchain
        if: ${{ steps.restore.outputs.cache-hit == 'true' }}
        run: time bash scripts/ci/toolchain.sh verify

      - name: Save newly provisioned toolchain
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/oxcaml' && !(github.event_name == 'workflow_dispatch' && inputs.cold) && steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.OPAMROOT }}
          key: ${{ steps.setup.outputs.key }}

      - name: Build and test this checkout
        run: PATH=/usr/bin:/bin /usr/bin/opam exec --readonly --switch="$OPAMSWITCH" -- bash scripts/ci/check.sh

      - name: Package and verify this checkout
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          BUILD_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)+([.-][a-zA-Z0-9.-]+)?$ ]]
            version="${RELEASE_TAG#v}-${BUILD_OS}"
          else
            version="0.1.0-dev.$(git rev-parse --short=12 HEAD)-${BUILD_OS}"
          fi
          PATH=/usr/bin:/bin /usr/bin/opam exec --readonly --switch="$OPAMSWITCH" -- \
            python3 scripts/package_release.py --version "$version" --strip -j "$COBALT_BUILD_JOBS"
          (cd dist && sha256sum -c "cobalt-$version-linux-x86_64.sha256")
          python3 packaging/smoke.py "dist/cobalt-$version-linux-x86_64.tar.gz"

      - name: Upload verified packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobalt-${{ matrix.os }}
          path: dist/cobalt-*
          if-no-files-found: error
          overwrite: true

  release:
    if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: cobalt-release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download both verified packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cobalt-ubuntu-*
          path: packages
          merge-multiple: true

      - name: Attach packages to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)+([.-][a-zA-Z0-9.-]+)?$ ]]
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Cobalt ${RELEASE_TAG#v}" --generate-notes
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          cd packages
          for os in ubuntu-24.04 ubuntu-26.04; do
            stem="cobalt-${RELEASE_TAG#v}-$os-linux-x86_64"
            sha256sum -c "$stem.sha256"
            python3 -c 'import json, sys; m = json.load(open(sys.argv[1])); assert m["git_commit"] == sys.argv[2] and not m["working_tree_dirty"]' "$stem.manifest.json" "$commit"
          done
          gh release upload "$RELEASE_TAG" cobalt-* --clobber
